components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived session access token passed in Authorization headers.
    RefreshTokenCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Secure HTTP-only refresh token used to request new access tokens.
    TelegramSecretVerification:
      type: apiKey
      in: header
      name: X-Telegram-Bot-Api-Secret-Token
      description: Shared bot secret payload validating inbound Webhook calls.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Reserved API key token for external script integrations.
    OAuth2Placeholder:
      type: oauth2
      description: Reserved for future oauth integrations.
      flows:
        authorizationCode:
          authorizationUrl: https://auth.devmate.internal/oauth/authorize
          tokenUrl: https://auth.devmate.internal/oauth/token
          scopes:
            read: Grant view permissions on owned resources.
            write: Grant modification permissions on owned resources.

  parameters:
    PageParam:
      name: page
      in: query
      description: Target page index.
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      description: Max record items count.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    CursorParam:
      name: cursor
      in: query
      description: Encoded cursor pointer for page offsets.
      required: false
      schema:
        type: string
    SortParam:
      name: sortBy
      in: query
      description: Column name path filter.
      required: false
      schema:
        type: string
    OrderParam:
      name: sortOrder
      in: query
      description: Sort direction.
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    SearchParam:
      name: q
      in: query
      description: Keyword search term.
      required: true
      schema:
        type: string
        minLength: 1

  headers:
    CorrelationIdResponseHeader:
      description: Ingress trace correlation tracker ID UUID.
      schema:
        type: string
        format: uuid
    RequestIdResponseHeader:
      description: Request socket tracker ID UUID.
      schema:
        type: string
        format: uuid
    RateLimitLimit:
      description: Request limit count allotted per window.
      schema:
        type: integer
    RateLimitRemaining:
      description: Remaining requests left in window.
      schema:
        type: integer
    RateLimitReset:
      description: Remaining seconds until rate window reset.
      schema:
        type: integer

  responses:
    ValidationError:
      description: Input validation constraints violations.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationIdResponseHeader'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorEnvelope'
    BusinessError:
      description: Core business rules logic violation.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationIdResponseHeader'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Authentication failure due to missing or expired tokens.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Action denied due to insufficient scope permissions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: The requested resource could not be found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Action conflicts with current entity state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimitError:
      description: Too many requests processed in window.
      headers:
        Retry-After:
          description: Wait seconds before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServerError:
      description: Internal system error log tracker.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  callbacks:
    JobCompletedCallback:
      '{$request.body#/callbackUrl}':
        post:
          summary: Background Job State Update Callback
          description: Alerts caller application when async jobs (OCR, PDF, Backups) finish execution.
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required:
                    - jobId
                    - status
                    - completedAt
                  properties:
                    jobId:
                      type: string
                      format: uuid
                    status:
                      type: string
                      enum: [COMPLETED, FAILED]
                    completedAt:
                      type: string
                      format: date-time
                    resultUrl:
                      type: string
                      format: uri
          responses:
            '200':
              description: Callback acknowledged by client application.

  schemas:
    TelegramAuthRequest:
      type: object
      required:
        - id
        - first_name
        - auth_date
        - hash
      properties:
        id:
          type: integer
          description: Telegram user ID
        first_name:
          type: string
          description: Telegram user first name
        last_name:
          type: string
          description: Telegram user last name
        username:
          type: string
          description: Telegram username handle
        auth_date:
          type: integer
          description: Epoch timestamp of authorization
        hash:
          type: string
